# Memory
memory_limit=256M

; OPcache and realpath cache - file stats over the Windows bind mount are slow,
; so cache more files and re-check timestamps less often - code edits show up within about 10s
opcache.memory_consumption=256
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=30000
opcache.validate_timestamps=1
opcache.revalidate_freq=10
realpath_cache_size=16M
realpath_cache_ttl=600

# Upload restrictions
upload_max_filesize=2000M

# Post max size
post_max_size=2000M

# Max execucation time
max_execution_time=90

# Timezone
date.timezone=Australia/Melbourne

# sendmail path to use mailhog
sendmail_path = '/usr/local/bin/mhsendmail --smtp-addr=mailhog:1025'

# display_errors
display_errors = 0

#  error_reporting
error_reporting = E_ALL & ~E_NOTICE & ~E_DEPRECATED & ~E_STRICT & ~E_WARNING

# display_startup_errors
display_startup_errors = 1

# log errors
log_errors = On

#  error logs
error_log = /var/log/php_error.log